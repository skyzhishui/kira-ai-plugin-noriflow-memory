<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆星图 · MEMORY ATLAS</title>
  <!-- 防主题闪烁：宿主 plugin-bridge 会按 WebUI 主题贴 [data-theme]；
       bridge 到达前的首帧用系统配色兜底（与卡面默认亮色不冲突）。 -->
  <script>
    (function () {
      try {
        document.documentElement.setAttribute(
          "data-theme",
          matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        );
      } catch (e) { /* 环境不支持 matchMedia 时沿用 CSS 默认亮色 */ }
    })();
  </script>
  <link rel="stylesheet" href="memory.css?v=2026102303">
</head>
<body>
  <!-- 环境氛围层：极光雾团 / 星尘画布 / 观测网格 / 暗角 / 银盐颗粒（纯装饰，不拦截交互） -->
  <div class="fx" aria-hidden="true">
    <div class="fx-aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
    <canvas id="fx-canvas"></canvas>
    <div class="fx-grid"></div>
    <div class="fx-vignette"></div>
    <div class="fx-grain"></div>
  </div>

  <!-- 观测站 banner：本地记忆观测台 -->
  <header class="hero">
    <div class="hero-copy">
      <div class="hero-eyebrow"><span class="hero-dot"></span>MEMORY ATLAS · RECALL ENGINE</div>
      <h1 class="hero-title">记忆星图</h1>
      <p class="hero-line">本地记忆观测台——每一段对话都会收进这片星空。重要的事，它都记得。</p>
      <div class="hero-chips">
        <span class="chip"><i></i>对话摘要</span>
        <span class="chip c2"><i></i>事实簇</span>
        <span class="chip c3"><i></i>用户画像</span>
        <span class="chip c4"><i></i>关系图谱</span>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <span class="orbit o1"></span>
      <span class="orbit o2"></span>
      <span class="orbit o3"></span>
      <span class="h-mote m1"></span>
      <span class="h-mote m2"></span>
      <span class="h-mote m3"></span>
    </div>
  </header>

  <main id="content"><div class="loading">正在打捞记忆</div></main>

  <footer class="site-foot">
    <span class="foot-orb" aria-hidden="true">
      <img src="assets/memory-orb.png" alt="" loading="lazy" onerror="this.style.display='none'">
    </span>
    <span class="foot-mark">MEMORY ATLAS // LOCAL RECALL ENGINE</span>
    <span class="foot-quip" id="foot-quip">星图已点亮，欢迎回来。</span>
  </footer>

  <div id="toast-root"></div>
  <div id="modal-root"></div>
  <script src="ambient.js?v=2026102303"></script>
  <script src="memory.js?v=2026102303"></script>
</body>
</html>
