name: CI

on:
  push:
    branches: [main, sqlite-backend]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # test suites print CJK progress lines; force UTF-8 stdio on all runners
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # tomli is pulled in automatically on Python 3.10 via the
          # python_version marker in requirements.txt; requirements-dev.txt
          # adds the host-provided deps the suites need (pydantic)
          pip install -r requirements.txt -r requirements-dev.txt

      # Suites are self-contained direct-run scripts (python tests/test_x.py),
      # not pytest collections; each exits non-zero on the first failed check.
      - name: Run test suites
        run: |
          for f in tests/test_*.py; do
            echo "::group::python $f"
            python "$f"
            echo "::endgroup::"
          done
